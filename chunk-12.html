<script>
(function(){
'use strict';
/* Pass 2b: the loop machine is now a DECISION JOURNEY at fixed checkpoints

   record; replay resets. The runners-left counter keeps the Batch A behavior:
   it shows the field at the last REPORTED checkpoint and holds there between
   checkpoints, and the journey card says which checkpoint each count is from.

   buttons are review shortcuts and do not trigger calls. */
var VIEW_ID='second-place-is-a-dnf';
var S={loops:0,stopped:false,banked:0,adjVal:0,adjFrom:-1,adjUntil:-1,pending:false,pendingTarget:-1,call1:false,call2:false};
var ANCHORS=[[0,72],[72,25],[95,10],[111,4],[113,2],[114,1]];
var STOPS=[0,1,24,48,72,96,114,119];
function fieldAt(n){
  var v=72;
  for(var i=0;i<ANCHORS.length;i++){if(n>=ANCHORS[i][0])v=ANCHORS[i][1];}
  return v;
}
function checkpointAt(n){
  var c=0;
  for(var i=0;i<ANCHORS.length;i++){if(n>=ANCHORS[i][0])c=ANCHORS[i][0];}
  return c;
}
function nextStop(n){
  for(var i=0;i<STOPS.length;i++){if(STOPS[i]>n)return STOPS[i];}
  return -1;
}
function hrAt(n){
  if(n<=6)return 126;
  var d=15*Math.min(1,(n-6)/44);

}
function rpeAt(n){
  var base=9.7+6.3*Math.min(1,n/102);

function sleepDebt(n){return Math.max(0,n-S.banked/60);}
function miles(n){return n*100/24;}
var CAPS={
start:'Race morning, a trail race start line. Illustrative photo: Dmitrii Eremin via Pexels.',
day:'The day loop is trail, through the woods. Illustrative photo: Alin Serban via Pexels.',
dusk:'Dusk. At Big\u2019s the race moves to the road loop for the night. Illustrative photo: Taiye Salawu via Pexels.',
night:'Night trail, by headlamp. Illustrative photo: Tomasz Mastalerz via Pexels.',
deep:'The night road loop, deep into the race. Illustrative photo: VANNGO Ng via Pexels.',
dawn:'Dawn. Still running. Illustrative photo: Dom Gould via Pexels.'
};
function phaseFor(n){
  if(n<=0)return 'start';
  var total=7+n,h=total%24,d=Math.floor(total/24);

  if(h>=6&&h<18)return 'day';

var DAYS=['Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday'];
function clockFor(n){

var NOTES={
1:'Loop 1 done. All 72 are still in. It feels easy. It is supposed to.',
24:'24 loops. 100 miles in one day. Night 1 is behind you.',
48:'48 loops. 200 miles. Two full days of the same question.',
72:'72 loops. Real checkpoint: at least 25 of the 72 starters finished this loop in 2025.',
96:'96 loops. Four full days. Ten runners had reached 95 in 2025; the field is not counted again until 111.',
114:'114 loops. Phil Gore wins Big\u2019s 2025, the only finisher of 72. The world record is 119, at a different race.',
119:'119 loops. You have matched the world record: 495.8 miles, just under five days of hourly starts. The machine stops here. So does everyone.'
};
var JOURNEY={
0:{field:'72 starters on the line. Nobody has run a loop yet.',
   call:'Get to the first checkpoint. Every decision in this race is made one hour at a time.',
   evid:'The machine runs on the studies below: Belgian race physiology, Suffolk sleep and cognition work, and the reported checkpoints of the 2025 championship.'},
1:{field:'72 of 72 starters finished loop 1 (reported at the start). The next reported checkpoint is loop 72; until then the counter holds at 72, because the field is not counted between checkpoints.',
   call:'Run slower than feels right. Loop 1 decides nothing except pace: bank nothing, prove nothing, and be back before the hour turns.',
   evid:'Cardiovascular drift starts about 10 minutes in: each heartbeat pumps a little less blood, so the heart charges more for the same pace. In the Belgian race the cost surfaced as effort, not heart rate: 9.7 of 20 in the first quarter, on its way to 16.0.'},
24:{field:'Not reported at loop 24. The counter holds at 72, from the start line; the next reported checkpoint is loop 72.',
   call:'Night 1 is the first real decision of the race, and you made it on the way here: bank sleep in scraps, like the record holder, or push on and let the debt climb.',
   evid:'Sleep loss hits thinking first. After runners quit at the Suffolk backyard ultra, choice reaction time had slowed by 77 milliseconds and mental flexibility was worse, while planning held up. Gore banks about 2 to 2.5 hours a night, in scraps; Lewis races on naps of about 4 minutes.'},
48:{field:'Still not reported. The field is next counted at loop 72; the hold at 72 is a reporting gap, not a claim that nobody has stopped.',
   call:'Night 2: eat on the slow loop and protect the whistle. The record holder takes one slower loop after a nap to eat and reset. Missing a start ends the race as surely as collapsing does.',
   evid:'The Belgian runners answered drift by slowing down: 9.0 to 7.5 km/h from start to finish, while heart rate stayed flat, 126 to 121 bpm. A Belgian vigilance test slowed from 243 to 283 milliseconds across the race.'},
72:{field:'At least 25 of the 72 starters finished loop 72 (reported checkpoint). Each of them is at 300 miles.',
   call:'Three days in, the call is protection: never be late for a start, and spend the minutes between loops on food, feet, and sleep, in that order.',
   evid:'Past 35 laps in the Belgian race, runners who would stop showed the drift and runners who would not did not, at the same speed. The researchers call that gap physiological resilience, and it separated the field better than speed.'},
96:{field:'10 runners finished loop 95 (reported checkpoint); the count holds there until loop 111. Sarah Perry was one of the ten: she stopped at 95, on purpose, with a sore back, holding the women\u2019s world record.',
   call:'Stopping can be the decision, not the failure. Perry banked a world record by stopping. The call at 96 is whether your reason to continue beats the mark you already hold.',
   evid:'The rest is runner reported, never measured: figures Lewis called grass people, gibberish on day four. Banked naps buy back some alertness; they do not erase three nights of debt.'},
114:{field:'4 runners finished loop 111; 2 finished loop 113; Gore alone finished 114 (all reported checkpoints).',
   call:'The assist\u2019s call: Steyaert stopped at 113 and handed Gore the win. One more loop is the entire sport: run it and the race continues; stop, and 470.83 miles goes into the books as a DNF.',
   evid:'It has happened at every level. In 2023 Ihor Verys ran 445.83 miles and is recorded as the assist: a DNF. In June 2025 Sam Harvey ran 118 loops beside Gore\u2019s record: the second greatest run in the sport\u2019s history, also a DNF.'},
119:{field:'No field: this is past the 2025 championship, which ended at 114. The 119 was run at Dead Cow Gully in June 2025, a different race.',
   call:'There is no call left. The machine stops at the record because everyone does.',
   evid:'119 loops, 495.8 miles, Phil Gore, Dead Cow Gully, Australia, June 2025. The championship mark (114, Big\u2019s, October 2025) and the world record (119, Dead Cow Gully, June 2025) are separate lines in the records below, and they stay separate.'}
};
function fallbackNote(n){
  var left=fieldAt(n),m=miles(n).toFixed(1),cp=checkpointAt(n);
  var cpTxt=cp===0?'the start':'loop '+cp;
  return 'Loop '+n+' done. '+m+' miles in. Runners still in at the last reported checkpoint ('+cpTxt+'): '+left+'.';

function q(root,sel){try{return root.querySelector(sel);}catch(e){return null;}}
function setText(el,txt){if(el)el.textContent=txt;}

  var phase=phaseFor(n);
  var machine=q(root,'#p417-machine');
  if(machine)machine.setAttribute('data-phase',phase);

  setText(q(root,'#p417-clock'),n===0?'Saturday, 7:00 AM \u00B7 the first start':clockFor(n)+' \u00B7 day '+(Math.floor((7+n)/24)+1));
  setText(q(root,'#p417-stloops'),String(n));
  setText(q(root,'#p417-stmiles'),miles(n).toFixed(1));
  setText(q(root,'#p417-stleft'),String(fieldAt(n)));
  var ring=q(root,'#p417-ringfg');
  if(ring)ring.setAttribute('stroke-dashoffset',(175.93*(1-n/119)).toFixed(2));
  setText(q(root,'#p417-ringnum'),String(n));
  var hr=hrAt(n);

  var hrf=q(root,'#p417-hrfill'); if(hrf)hrf.style.width=((hr-100)/50*100)+'%';
  var rpe=rpeAt(n);
  setText(q(root,'#p417-rpeval'),rpe.toFixed(1));
  var rf=q(root,'#p417-rpefill'); if(rf)rf.style.width=((rpe-6)/14*100)+'%';

  for(var j=0;j<jumps.length;j++){
    var on=+jumps[j].getAttribute('data-p417-jump')===n;

function verdictText(n){
  var m=miles(n).toFixed(1);
  var left=fieldAt(n);

  else if(n===119)s+='That matches the world record exactly. Nobody has ever run loop 120. ';
  else s+='At the last reported checkpoint (loop '+checkpointAt(n)+'), '+left+' of the 72 starters were still in. ';
  if(S.banked>0)s+='Along the way you banked '+S.banked+' minutes of naps. ';
  s+='Everyone who stops gets the same word in the results: DNF. Phil Gore won the 2025 Big\u2019s world championship with 114 loops. The world record is 119, also Gore, from Dead Cow Gully in June 2025.';

function land(root,n){

function doAdvance(root){
  if(S.stopped||S.pending||S.loops>=119)return;

function doJump(root,n){

function doStop(root){
  if(S.stopped||S.pending)return;

  if(verdict)verdict.hidden=false;
  setText(q(root,'#p417-verdict-p'),verdictText(S.loops));
  var youmark=q(root,'#p417-youmark');
  if(youmark){youmark.hidden=false;youmark.style.left=(S.loops/119*100)+'%';var lab=youmark.querySelector('.p417-mlab');if(lab)lab.textContent='You \u00B7 '+S.loops;}

function doAgain(root){

  var youmark=q(root,'#p417-youmark');
  if(youmark)youmark.hidden=true;
  setText(q(root,'#p417-note'),'The whistle blows at the top of every hour. Three whistles, then two, then one, then the bell. Advance to loop 1 to begin.');

function choose(root,kind){
  if(!S.pending)return;
  S.pending=false;
  var target=S.pendingTarget; S.pendingTarget=-1;
  if(target===24)S.call1=true;
  if(target===48)S.call2=true;

function init(){
  var root=document.getElementById(VIEW_ID);
  if(!root)return false;
  if(root.getAttribute('data-p417-init')==='1')return true;
  root.setAttribute('data-p417-init','1');
  root.addEventListener('click',function(ev){
    var t=ev.target;
    if(!t||typeof t.closest!=='function')return;
    var jb=t.closest('[data-p417-jump]');
    if(jb&&root.contains(jb)){try{doJump(root,+jb.getAttribute('data-p417-jump'));}catch(e){}return;}

    if(!b||!root.contains(b))return;
    var a=b.getAttribute('data-p417');
    try{
      if(a==='run')doAdvance(root);
      else if(a==='stop')doStop(root);
      else if(a==='again')doAgain(root);
      else if(a==='nap')choose(root,'nap');
      else if(a==='push')choose(root,'push');

}
try{
  if(!init()){
    var mo=new MutationObserver(function(){if(init()){try{mo.disconnect();}catch(e){}}});
    mo.observe(document.documentElement,{childList:true,subtree:true});
    setTimeout(function(){try{mo.disconnect();}catch(e){}},20000);
  }
  document.addEventListener('DOMContentLoaded',function(){init();});
  window.addEventListener('hashchange',function(){init();});
}catch(e){}
})();
</script>

(function(){

 var prev=RATE[curScore]*RRR*10;

 });

/* Scroll choreography: pinned stages, steps, ambient night life.
   One easing language: cubic-bezier(.22,.61,.21,1), slow morphs, no bounce.
   Bone ink on regolith black; the single accent is earthlight blue, kept
   to the Earth disc, the transition marker, and the MODEL tag. */
#marathon-on-the-moon .p435-scrolly{display:grid;grid-template-columns:1.3fr .8fr;gap:34px;align-items:start;margin:6px 0 10px}
#marathon-on-the-moon .p435-scrolly .p435-stagebox{margin:0;max-width:none}

#marathon-on-the-moon .p435-step{min-height:58vh;display:flex;flex-direction:column;justify-content:center;opacity:.38;transition:opacity .45s cubic-bezier(.22,.61,.21,1)}
#marathon-on-the-moon .p435-step.p435-step-active{opacity:1}
#marathon-on-the-moon .p435-step .p435-body{margin:0}
#marathon-on-the-moon .p435-step-kicker{font:600 11px "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--p435-ink);margin:0 0 14px}

#marathon-on-the-moon .p435-meter{height:5px;background:var(--p435-ground2);border:1px solid var(--p435-line);margin:12px 22px 0;overflow:hidden}
#marathon-on-the-moon .p435-meter-fill{display:block;height:100%;width:0%;background:var(--p435-ink);will-change:width}
#marathon-on-the-moon .p435-phase{font:700 12px "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--p435-ink);margin:10px 22px 0}
#marathon-on-the-moon .p435-stagebox{background-image:radial-gradient(ellipse at 78% 12%,rgba(127,178,229,.07),transparent 55%),repeating-linear-gradient(0deg,rgba(233,230,218,.022) 0 1px,transparent 1px 7px);animation:p435-night 18s ease-in-out infinite}
@keyframes p435-night{0%,100%{background-color:var(--p435-panel)}50%{background-color:#181E28}}
#marathon-on-the-moon .p435-earth{animation:p435-shimmer 6.5s ease-in-out infinite}
@keyframes p435-shimmer{0%,100%{opacity:.82}50%{opacity:1}}
#marathon-on-the-moon .p435-stars{animation:p435-twinkle 5s ease-in-out infinite}

#marathon-on-the-moon .p435-route{animation:p435-march 3.2s linear infinite}
@keyframes p435-march{from{stroke-dashoffset:0}to{stroke-dashoffset:-26}}
#marathon-on-the-moon #p435-walk-path,#marathon-on-the-moon #p435-run-path,#marathon-on-the-moon #p435-trans-group,#marathon-on-the-moon #p435-bounce-group{will-change:transform,opacity}
@media (max-width:700px){

#marathon-on-the-moon .p435-phase{margin-left:14px;margin-right:14px}
#marathon-on-the-moon .p435-meter{margin-left:14px;margin-right:14px}
#marathon-on-the-moon .p435-step-alt{margin-left:14px;margin-right:14px}
}
@media (prefers-reduced-motion: reduce){
#marathon-on-the-moon .p435-stagebox{animation:none}
#marathon-on-the-moon .p435-earth{animation:none;opacity:1}

/* ===== Essay 42 · Tie Down the Good Hand · The Picture Book ===== */
/* Essay 42, Picture Book format build, 2026-11-13.

   boxes, no cards. Each beat is one full-bleed painted scene that fills
