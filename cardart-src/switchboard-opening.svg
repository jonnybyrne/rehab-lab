<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Drawn scene: a face run like a switchboard. Two glass control rooms, one per hemisphere, sit above the face. Brass cords run from both rooms to the forehead half of a junction box at the base of the skull; one teal cord crosses to its mouth half; a single nerve cable leaves the box for the face. The face is drawn in the classic stroke pattern: forehead lit, lower face dark on one side. Drawn, not photographed."><defs>
