<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Drawn scene: a house at dusk after a storm, cut open like a doll's house. A lightning bolt has struck the trunk line at the roof. Inside, on the left, amber pipes run down from a pump to a pressure gauge whose needle sits low. On the right, cyan wires run to a switchboard whose switches are all dark. The house is a drawn metaphor for a spinal cord injury and its two failing systems."><defs>
