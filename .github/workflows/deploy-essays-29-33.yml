name: Deploy essays 29 to 33

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with candidate and remove candidate
        run: |
          set -euo pipefail
          test "$(stat -c%s index.html)" = "4156689"
          test "$(stat -c%s index-candidate-2933.html)" = "4500187"
          cp index-candidate-2933.html index.html
          rm index-candidate-2933.html
          ls -l index.html
          test ! -e index-candidate-2933.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Deploy essays 29 to 33, Pudding scroll edition"
          git push
