name: Assemble essay 50 index
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/assemble-50.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render JPG card art from pushed SVG source
        run: |
          pip install --quiet cairosvg pillow
          python3 - << 'EOF'
          import cairosvg, io
          from PIL import Image
          png = cairosvg.svg2png(url='cardart-src/two-shocks-opening.svg', output_width=1440)
          Image.open(io.BytesIO(png)).convert('RGB').save('images/two-shocks-house.jpg', quality=88)
          print('rendered images/two-shocks-house.jpg')
          EOF
      - name: Assemble index.html from chunks
        run: |
          cat chunk50-*.html > index.html
          echo "e21e7ed72683331d7c4a99b55ea41cf9  index.html" | md5sum -c -
      - name: Commit assembled index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html images/two-shocks-house.jpg
          git commit -m "Assemble essay 50 index from chunks"
          git push
