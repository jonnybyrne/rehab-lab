name: Assemble essays 38-39 index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble index.html from chunks and verify md5
        run: |
          cat chunk-00.html chunk-01.html chunk-02.html chunk-03.html chunk-04.html chunk-05.html chunk-06.html chunk-07.html chunk-08.html chunk-09.html chunk-10.html chunk-11.html chunk-12.html chunk-13.html > index.html
          actual="$(md5sum index.html | awk '{print $1}')"
          echo "Assembled index.html md5: $actual"
          if [ "$actual" != "065d48eb6b6c64f0a92b58636dfddf8c" ]; then
            echo "ERROR: assembled md5 $actual does not match expected 065d48eb6b6c64f0a92b58636dfddf8c; refusing to commit."
            exit 1
          fi

      - name: Commit assembled index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Assemble essays 38-39 index from chunks"
          git push
