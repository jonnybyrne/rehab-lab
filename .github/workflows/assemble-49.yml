name: Assemble essay 49 index
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/assemble-49.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render JPG card art from pushed SVG source
        run: |
          pip install --quiet cairosvg pillow
          python3 - << 'EOF'
          import cairosvg, io
          from PIL import Image
          png = cairosvg.svg2png(url='cardart-src/the-descent-opening.svg', output_width=1440)
          Image.open(io.BytesIO(png)).convert('RGB').save('images/descent-opening.jpg', quality=88)
          print('rendered images/descent-opening.jpg')
          EOF
      - name: Assemble index.html from chunks
        run: |
          cat chunk49-*.html > index.html
          echo "aa9f1dc4b8286879cd495d8b1a112cea  index.html" | md5sum -c -
      - name: Commit assembled index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html images/descent-opening.jpg
          git commit -m "Assemble essay 49 index from chunks"
          git push
