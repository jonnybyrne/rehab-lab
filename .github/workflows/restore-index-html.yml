name: Restore old index.html
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index.html from b81617e
        run: |
          git config user.name "jonnybyrne"
          git config user.email "jonnybyrne@users.noreply.github.io"
          git checkout b81617e -- index.html
          git status --short
          ls -l index.html
          git commit -m "Restore old index.html" -- index.html
          git push origin HEAD:main
